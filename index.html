<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive 3D Periodic Table</title>

<style>
  :root {
    --bg: #08111f;
    --panel: rgba(17, 30, 51, .88);
    --text: #edf5ff;
    --muted: #9db0ca;
    --tile: 58px;
    --gap: 7px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(ellipse at top, #142747 0%, #08111f 55%, #050a12 100%);
  }
  header { padding: 26px 22px 14px; text-align: center; }
  h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 3rem); letter-spacing: .02em; }
  header p { margin: 9px auto 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
  .controls {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 9px;
    padding: 14px 16px 20px;
  }
  button { font: inherit; cursor: pointer; }
  .layout-btn {
    border: 1px solid #304866; color: #dceaff; background: #13233a;
    border-radius: 999px; padding: 9px 16px; transition: .2s ease;
  }
  .layout-btn:hover, .layout-btn.active { background: #3568a9; border-color: #76a9ed; color: white; }
  #viewport {
    position: relative; height: min(68vh, 690px); min-height: 470px;
    margin: 0 auto; width: min(100%, 1200px); overflow: hidden;
    perspective: 1200px; border-block: 1px solid rgba(122, 163, 218, .13);
    background: radial-gradient(ellipse at center, rgba(42, 76, 119, .18), transparent 66%);
    touch-action: pan-y;
  }
  #scene {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transform: rotateX(-8deg) rotateY(0deg);
  }
  .element {
    position: absolute; width: var(--tile); height: var(--tile);
    left: 50%; top: 50%; margin-left: calc(var(--tile) / -2); margin-top: calc(var(--tile) / -2);
    padding: 4px; border: 1px solid var(--accent);
    border-radius: 10px; color: #f7fbff; background: color-mix(in srgb, var(--accent) 18%, #0c1728);
    box-shadow: inset 0 0 14px color-mix(in srgb, var(--accent) 16%, transparent), 0 5px 15px #0004;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform-style: preserve-3d; backface-visibility: hidden;
    transition: border-color .2s, background .2s, box-shadow .2s;
    user-select: none;
  }
  .element:hover { background: color-mix(in srgb, var(--accent) 35%, #102039); box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 35%, transparent); z-index: 20; }
  .element .number { align-self: flex-start; font-size: 9px; opacity: .85; line-height: 1; }
  .element .symbol { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .element .name { font-size: 7px; white-space: nowrap; opacity: .9; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .element .mass { font-size: 7px; opacity: .72; }
  .element.is-expanded { z-index: 100; border-color: white; background: #183456; box-shadow: 0 0 0 2px #fff4, 0 0 45px var(--accent); }
  #details {
    position: absolute; right: 18px; bottom: 18px; width: min(300px, calc(100% - 36px));
    padding: 16px; border: 1px solid #395779; border-radius: 16px;
    background: rgba(7, 16, 29, .92); backdrop-filter: blur(12px);
    box-shadow: 0 18px 45px #0005; z-index: 200;
  }
  #details[hidden] { display: none; }
  #details-top { display: flex; align-items: flex-start; gap: 13px; }
  #detail-symbol {
    flex: 0 0 64px; height: 64px; display: grid; place-items: center;
    font-size: 30px; font-weight: 800; border-radius: 12px; border: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 20%, #0c1728);
  }
  #detail-name { margin: 0 0 5px; font-size: 1.25rem; }
  #detail-category { color: var(--muted); font-size: .84rem; }
  #detail-facts { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .fact { background: #13233a; padding: 9px; border-radius: 9px; }
  .fact span { display: block; color: var(--muted); font-size: .72rem; margin-bottom: 3px; }
  .fact strong { font-size: .9rem; }
  #close-details {
    position: absolute; right: 10px; top: 9px; border: 0; color: #d9e8fb;
    background: transparent; font-size: 1.3rem; padding: 2px 7px;
  }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; padding: 18px 16px 8px; }
  .legend-item { color: var(--muted); font-size: .78rem; display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .hint { text-align: center; color: var(--muted); font-size: .8rem; padding: 8px 16px 24px; }
  @media (max-width: 700px) {
    :root { --tile: 43px; --gap: 4px; }
    #viewport { height: 65vh; min-height: 440px; }
    .element { border-radius: 7px; padding: 3px; }
    .element .symbol { font-size: 16px; }
    .element .number { font-size: 7px; }
    .element .name, .element .mass { display: none; }
    #details { right: 10px; bottom: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Periodic Table <span style="color:#7bb8ff">in 3D</span></h1>
  <p>Explore the elements. Switch layouts, rotate the scene, and select any element to learn more.</p>
</header>

<nav class="controls" aria-label="Choose periodic table layout">
  <button class="layout-btn active" data-layout="classic">Classic</button>
  <button class="layout-btn" data-layout="sphere">Sphere</button>
  <button class="layout-btn" data-layout="helix">Helix</button>
  <button class="layout-btn" data-layout="grid">3D Grid</button>
</nav>

<main>
  <section id="viewport" aria-label="Interactive 3D periodic table">
    <div id="scene"></div>
    <aside id="details" hidden aria-live="polite">
      <button id="close-details" aria-label="Close element details">×</button>
      <div id="details-top">
        <div id="detail-symbol">H</div>
        <div><h2 id="detail-name">Hydrogen</h2><div id="detail-category">Nonmetal</div></div>
      </div>
      <div id="detail-facts">
        <div class="fact"><span>Atomic number</span><strong id="detail-number">1</strong></div>
        <div class="fact"><span>Atomic mass</span><strong id="detail-mass">1.008</strong></div>
        <div class="fact"><span>Period</span><strong id="detail-period">1</strong></div>
        <div class="fact"><span>Group</span><strong id="detail-group">1</strong></div>
      </div>
    </aside>
  </section>
  <div class="legend" id="legend"></div>
  <p class="hint">Tip: drag or move your pointer to rotate the scene. Select an element for details. Press Escape to close.</p>
</main>

<script>
const rawElements = [
[1,"H","Hydrogen",1,1,1.008,"Nonmetal"],[2,"He","Helium",18,1,4.0026,"Noble gas"],
[3,"Li","Lithium",1,2,6.94,"Alkali metal"],[4,"Be","Beryllium",2,2,9.0122,"Alkaline earth metal"],
[5,"B","Boron",13,2,10.81,"Metalloid"],[6,"C","Carbon",14,2,12.011,"Nonmetal"],[7,"N","Nitrogen",15,2,14.007,"Nonmetal"],[8,"O","Oxygen",16,2,15.999,"Nonmetal"],[9,"F","Fluorine",17,2,18.998,"Halogen"],[10,"Ne","Neon",18,2,20.180,"Noble gas"],
[11,"Na","Sodium",1,3,22.990,"Alkali metal"],[12,"Mg","Magnesium",2,3,24.305,"Alkaline earth metal"],[13,"Al","Aluminium",13,3,26.982,"Post-transition metal"],[14,"Si","Silicon",14,3,28.085,"Metalloid"],[15,"P","Phosphorus",15,3,30.974,"Nonmetal"],[16,"S","Sulfur",16,3,32.06,"Nonmetal"],[17,"Cl","Chlorine",17,3,35.45,"Halogen"],[18,"Ar","Argon",18,3,39.948,"Noble gas"],
[19,"K","Potassium",1,4,39.098,"Alkali metal"],[20,"Ca","Calcium",2,4,40.078,"Alkaline earth metal"],[21,"Sc","Scandium",3,4,44.956,"Transition metal"],[22,"Ti","Titanium",4,4,47.867,"Transition metal"],[23,"V","Vanadium",5,4,50.942,"Transition metal"],[24,"Cr","Chromium",6,4,51.996,"Transition metal"],[25,"Mn","Manganese",7,4,54.938,"Transition metal"],[26,"Fe","Iron",8,4,55.845,"Transition metal"],[27,"Co","Cobalt",9,4,58.933,"Transition metal"],[28,"Ni","Nickel",10,4,58.693,"Transition metal"],[29,"Cu","Copper",11,4,63.546,"Transition metal"],[30,"Zn","Zinc",12,4,65.38,"Transition metal"],[31,"Ga","Gallium",13,4,69.723,"Post-transition metal"],[32,"Ge","Germanium",14,4,72.630,"Metalloid"],[33,"As","Arsenic",15,4,74.922,"Metalloid"],[34,"Se","Selenium",16,4,78.971,"Nonmetal"],[35,"Br","Bromine",17,4,79.904,"Halogen"],[36,"Kr","Krypton",18,4,83.798,"Noble gas"],
[37,"Rb","Rubidium",1,5,85.468,"Alkali metal"],[38,"Sr","Strontium",2,5,87.62,"Alkaline earth metal"],[39,"Y","Yttrium",3,5,88.906,"Transition metal"],[40,"Zr","Zirconium",4,5,91.224,"Transition metal"],[41,"Nb","Niobium",5,5,92.906,"Transition metal"],[42,"Mo","Molybdenum",6,5,95.95,"Transition metal"],[43,"Tc","Technetium",7,5,98,"Transition metal"],[44,"Ru","Ruthenium",8,5,101.07,"Transition metal"],[45,"Rh","Rhodium",9,5,102.91,"Transition metal"],[46,"Pd","Palladium",10,5,106.42,"Transition metal"],[47,"Ag","Silver",11,5,107.87,"Transition metal"],[48,"Cd","Cadmium",12,5,112.41,"Transition metal"],[49,"In","Indium",13,5,114.82,"Post-transition metal"],[50,"Sn","Tin",14,5,118.71,"Post-transition metal"],[51,"Sb","Antimony",15,5,121.76,"Metalloid"],[52,"Te","Tellurium",16,5,127.60,"Metalloid"],[53,"I","Iodine",17,5,126.90,"Halogen"],[54,"Xe","Xenon",18,5,131.29,"Noble gas"],
[55,"Cs","Caesium",1,6,132.91,"Alkali metal"],[56,"Ba","Barium",2,6,137.33,"Alkaline earth metal"],[57,"La","Lanthanum",3,6,138.91,"Lanthanide"],[58,"Ce","Cerium",3,6,140.12,"Lanthanide"],[59,"Pr","Praseodymium",3,6,140.91,"Lanthanide"],[60,"Nd","Neodymium",3,6,144.24,"Lanthanide"],[61,"Pm","Promethium",3,6,145,"Lanthanide"],[62,"Sm","Samarium",3,6,150.36,"Lanthanide"],[63,"Eu","Europium",3,6,151.96,"Lanthanide"],[64,"Gd","Gadolinium",3,6,157.25,"Lanthanide"],[65,"Tb","Terbium",3,6,158.93,"Lanthanide"],[66,"Dy","Dysprosium",3,6,162.50,"Lanthanide"],[67,"Ho","Holmium",3,6,164.93,"Lanthanide"],[68,"Er","Erbium",3,6,167.26,"Lanthanide"],[69,"Tm","Thulium",3,6,168.93,"Lanthanide"],[70,"Yb","Ytterbium",3,6,173.05,"Lanthanide"],[71,"Lu","Lutetium",3,6,174.97,"Lanthanide"],
[72,"Hf","Hafnium",4,6,178.49,"Transition metal"],[73,"Ta","Tantalum",5,6,180.95,"Transition metal"],[74,"W","Tungsten",6,6,183.84,"Transition metal"],[75,"Re","Rhenium",7,6,186.21,"Transition metal"],[76,"Os","Osmium",8,6,190.23,"Transition metal"],[77,"Ir","Iridium",9,6,192.22,"Transition metal"],[78,"Pt","Platinum",10,6,195.08,"Transition metal"],[79,"Au","Gold",11,6,196.97,"Transition metal"],[80,"Hg","Mercury",12,6,200.59,"Transition metal"],[81,"Tl","Thallium",13,6,204.38,"Post-transition metal"],[82,"Pb","Lead",14,6,207.2,"Post-transition metal"],[83,"Bi","Bismuth",15,6,208.98,"Post-transition metal"],[84,"Po","Polonium",16,6,209,"Post-transition metal"],[85,"At","Astatine",17,6,210,"Halogen"],[86,"Rn","Radon",18,6,222,"Noble gas"],
[87,"Fr","Francium",1,7,223,"Alkali metal"],[88,"Ra","Radium",2,7,226,"Alkaline earth metal"],[89,"Ac","Actinium",3,7,227,"Actinide"],[90,"Th","Thorium",3,7,232.04,"Actinide"],[91,"Pa","Protactinium",3,7,231.04,"Actinide"],[92,"U","Uranium",3,7,238.03,"Actinide"],[93,"Np","Neptunium",3,7,237,"Actinide"],[94,"Pu","Plutonium",3,7,244,"Actinide"],[95,"Am","Americium",3,7,243,"Actinide"],[96,"Cm","Curium",3,7,247,"Actinide"],[97,"Bk","Berkelium",3,7,247,"Actinide"],[98,"Cf","Californium",3,7,251,"Actinide"],[99,"Es","Einsteinium",3,7,252,"Actinide"],[100,"Fm","Fermium",3,7,257,"Actinide"],[101,"Md","Mendelevium",3,7,258,"Actinide"],[102,"No","Nobelium",3,7,259,"Actinide"],[103,"Lr","Lawrencium",3,7,266,"Actinide"],
[104,"Rf","Rutherfordium",4,7,267,"Transition metal"],[105,"Db","Dubnium",5,7,268,"Transition metal"],[106,"Sg","Seaborgium",6,7,269,"Transition metal"],[107,"Bh","Bohrium",7,7,270,"Transition metal"],[108,"Hs","Hassium",8,7,277,"Transition metal"],[109,"Mt","Meitnerium",9,7,278,"Transition metal"],[110,"Ds","Darmstadtium",10,7,281,"Transition metal"],[111,"Rg","Roentgenium",11,7,282,"Transition metal"],[112,"Cn","Copernicium",12,7,285,"Transition metal"],[113,"Nh","Nihonium",13,7,286,"Post-transition metal"],[114,"Fl","Flerovium",14,7,289,"Post-transition metal"],[115,"Mc","Moscovium",15,7,290,"Post-transition metal"],[116,"Lv","Livermorium",16,7,293,"Post-transition metal"],[117,"Ts","Tennessine",17,7,294,"Halogen"],[118,"Og","Oganesson",18,7,294,"Noble gas"]
];

const colors = {
  "Alkali metal":"#ff8f70", "Alkaline earth metal":"#ffca72", "Transition metal":"#76b8ff",
  "Post-transition metal":"#7de0c0", "Metalloid":"#c4a2ff", "Nonmetal":"#72e5e8",
  "Halogen":"#ff91bd", "Noble gas":"#a2aaff", "Lanthanide":"#e4a2ff", "Actinide":"#ff9db1"
};
const elements = rawElements.map(([number,symbol,name,group,period,mass,category]) => ({
  number,symbol,name,group,period,mass,category,color:colors[category] || "#a8bdd8"
}));
const scene = document.querySelector("#scene");
const viewport = document.querySelector("#viewport");
const details = document.querySelector("#details");
const buttons = [...document.querySelectorAll(".layout-btn")];
const tileSize = () => window.innerWidth <= 700 ? 47 : 65;
let currentLayout = "classic";
let selected = null;
let rotationX = -8, rotationY = 0, targetX = -8, targetY = 0;
let pointerDown = false, lastX = 0, lastY = 0;

function createElements() {
  scene.innerHTML = "";
  elements.forEach(el => {
    const button = document.createElement("button");
    button.className = "element";
    button.type = "button";
    button.style.setProperty("--accent", el.color);
    button.dataset.number = el.number;
    button.setAttribute("aria-label", `${el.name}, atomic number ${el.number}`);
    button.innerHTML = `<span class="number">${el.number}</span><span class="symbol">${el.symbol}</span><span class="name">${el.name}</span><span class="mass">${el.mass}</span>`;
    button.addEventListener("click", () => selectElement(el, button));
    scene.appendChild(button);
    el.node = button;
  });
}

function classicPosition(el) {
  const s = tileSize();
  const gap = window.innerWidth <= 700 ? 4 : 7;
  const unit = s + gap;
  const width = 18 * unit;
  const height = 7 * unit;
  // Place lanthanides and actinides in the two bottom rows.
  if (el.number >= 58 && el.number <= 71) return {x: -width/2 + (el.number-58+3)*unit, y: height/2 + unit*.55, z: 0};
  if (el.number >= 90 && el.number <= 103) return {x: -width/2 + (el.number-90+3)*unit, y: height/2 + unit*1.6, z: 0};
  if (el.number === 57) return {x: -width/2 + 2*unit, y: -height/2 + 5*unit, z: 0};
  if (el.number === 89) return {x: -width/2 + 2*unit, y: -height/2 + 6*unit, z: 0};
  return {x: -width/2 + (el.group-1)*unit, y: -height/2 + (el.period-1)*unit, z: 0};
}
function getPosition(el, layout, index) {
  const s = tileSize();
  if (layout === "classic") return classicPosition(el);
  if (layout === "grid") {
    const cols = 12, rows = Math.ceil(elements.length / cols);
    return {x:(index%cols-(cols-1)/2)*(s+7), y:(Math.floor(index/cols)-(rows-1)/2)*(s+5), z:((index%3)-1)*22};
  }
  if (layout === "sphere") {
    const phi = Math.acos(-1 + 2*(index+.5)/elements.length);
    const theta = Math.sqrt(elements.length*Math.PI)*phi;
    const radius = Math.min(viewport.clientWidth*.34, viewport.clientHeight*.34);
    return {x:radius*Math.sin(phi)*Math.cos(theta), y:radius*Math.cos(phi), z:radius*Math.sin(phi)*Math.sin(theta)};
  }
  // Helix: two intertwined-looking turns around a vertical axis.
  const angle = index * 0.42;
  const radius = Math.min(viewport.clientWidth*.28, 250);
  const height = Math.min(viewport.clientHeight*.75, 470);
  return {x:Math.cos(angle)*radius, y:(index/(elements.length-1)-.5)*height, z:Math.sin(angle)*radius};
}
function transformLayout(layout, animate=true) {
  currentLayout = layout;
  buttons.forEach(b => b.classList.toggle("active", b.dataset.layout === layout));

  elements.forEach((el, index) => {
    const node = el.node;
    const p = getPosition(el, layout, index);
    const expanded = selected && selected.number === el.number;
    const scale = expanded ? 1.35 : (layout === "classic" ? 1 : .82);
    const target = `translate3d(${p.x}px, ${p.y}px, ${p.z + (expanded ? 90 : 0)}px) scale(${scale})`;

    if (node._layoutAnimation) {
      node._layoutAnimation.cancel();
      node._layoutAnimation = null;
    }

    if (animate && typeof node.animate === "function") {
      const current = getComputedStyle(node).transform;
      node.style.transform = target;
      node._layoutAnimation = node.animate(
        [
          { transform: current === "none" ? "translate3d(0px, 0px, 0px) scale(1)" : current },
          { transform: target }
        ],
        {
          duration: 700,
          delay: (index % 12) * 18,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "none"
        }
      );
      node._layoutAnimation.onfinish = () => {
        node.style.transform = target;
        node._layoutAnimation = null;
      };
    } else {
      node.style.transform = target;
    }
  });
}
function selectElement(el, node) {
  if (selected && selected.number === el.number) {
    selected = null;
    elements.forEach(item => item.node.classList.remove("is-expanded"));
    details.hidden = true;
    transformLayout(currentLayout);
    return;
  }
  selected = el;
  elements.forEach(item => item.node.classList.toggle("is-expanded", item.number === el.number));
  document.querySelector("#detail-symbol").textContent = el.symbol;
  document.querySelector("#detail-name").textContent = el.name;
  document.querySelector("#detail-category").textContent = el.category;
  document.querySelector("#detail-number").textContent = el.number;
  document.querySelector("#detail-mass").textContent = el.mass;
  document.querySelector("#detail-period").textContent = el.period;
  document.querySelector("#detail-group").textContent = (el.number >= 58 && el.number <= 71) || (el.number >= 90 && el.number <= 103) ? "f-block" : el.group;
  document.querySelector("#detail-symbol").style.setProperty("--accent", el.color);
  details.hidden = false;
  transformLayout(currentLayout);
}
function closeDetails() {
  selected = null;
  elements.forEach(item => item.node.classList.remove("is-expanded"));
  details.hidden = true;
  transformLayout(currentLayout);
}
document.querySelector("#close-details").addEventListener("click", closeDetails);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetails(); });
buttons.forEach(button => button.addEventListener("click", () => transformLayout(button.dataset.layout)));
function buildLegend() {
  const legend = document.querySelector("#legend");
  [...new Set(elements.map(e => e.category))].forEach(category => {
    const item = document.createElement("span");
    item.className = "legend-item";
    item.innerHTML = `<i class="dot" style="background:${colors[category]}"></i>${category}`;
    legend.appendChild(item);
  });
}
// Pointer/touch drag controls the target rotation; interpolation keeps movement smooth.
viewport.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  pointerDown = true; lastX = e.clientX; lastY = e.clientY;
  viewport.setPointerCapture?.(e.pointerId);
});
viewport.addEventListener("pointermove", e => {
  if (!pointerDown) {
    const rect = viewport.getBoundingClientRect();
    const nx = (e.clientX - rect.left) / rect.width - .5;
    const ny = (e.clientY - rect.top) / rect.height - .5;
    targetY = nx * 28;
    targetX = -8 - ny * 18;
    return;
  }
  targetY += (e.clientX-lastX)*.35;
  targetX -= (e.clientY-lastY)*.3;
  lastX=e.clientX; lastY=e.clientY;
});
["pointerup","pointercancel","pointerleave"].forEach(evt => viewport.addEventListener(evt, () => pointerDown=false));
function animateRotation() {
  rotationX += (targetX-rotationX)*.08;
  rotationY += (targetY-rotationY)*.08;
  scene.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
  requestAnimationFrame(animateRotation);
}
createElements();
buildLegend();
transformLayout("classic", false);
animateRotation();
window.addEventListener("resize", () => transformLayout(currentLayout, false));
</script>
</body>
</html>
